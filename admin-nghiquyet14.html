<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin • Nghị quyết Đại hội XIV</title>

  <link rel="stylesheet" href="css/kienthuc.css"/>

  <style>
    .wrap{ max-width:1100px; margin:14px auto 40px; padding:0 14px; }
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
    .tabbtn{ padding:10px 12px; font-weight:900; border:1px solid #ddd; background:#fff; cursor:pointer; border-radius:10px; }
    .tabbtn.active{ background:#0b3d2e; color:#fff; border-color:#0b3d2e; }
    .grid{ display:grid; grid-template-columns: 420px 1fr; gap:12px; }
    @media (max-width: 980px){ .grid{ grid-template-columns:1fr; } }
    .box{ background:#fff; border:1px solid #ddd; border-radius:12px; overflow:hidden; }
    .box h2{ margin:0; padding:10px 12px; font-size:16px; border-bottom:1px solid #ddd; background:#fafafa; }
    .pad{ padding:12px; }
    .row{ display:grid; gap:8px; margin-bottom:10px; }
    .row label{ font-weight:900; font-size:12px; color:#444; }
    .k-input{ width:100%; padding:10px; font-size:15px; }
    .k-btn{ padding:10px 12px; font-weight:900; cursor:pointer; border:1px solid #ddd; background:#fff; border-radius:10px; }
    .k-btn-primary{ background:#0b3d2e; color:#fff; border-color:#0b3d2e; }
    .btnline{ display:flex; gap:8px; flex-wrap:wrap; }
    .status{ margin-top:8px; font-weight:900; }
    .ok{ color:#157a3a; }
    .bad{ color:#c62522; }

    .list{ display:flex; flex-direction:column; }
    .item{ padding:12px; border-bottom:1px solid #ddd; display:flex; gap:10px; align-items:flex-start; }
    .item:last-child{ border-bottom:none; }
    .meta{ color:#444; font-weight:700; font-size:13px; }
    .title{ font-weight:900; margin:0 0 6px; }
    .actions{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
    .pill{ font-size:12px; font-weight:900; padding:4px 8px; border:1px solid #ddd; border-radius:999px; background:#fafafa; }
    .k-note{ padding:12px; color:#666; text-align:center; }

    /* loading */
    .loading{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:9999; }
    .loading.hidden{ display:none; }
    .loading-box{ background:#fff; border-radius:12px; padding:16px 18px; min-width:220px; display:flex; flex-direction:column; align-items:center; gap:10px; font-weight:900; }
    .spinner{ width:28px;height:28px; border-radius:50%; border:4px solid #ddd; border-top-color:#0b3d2e; animation:spin .9s linear infinite; }
    @keyframes spin{ to{ transform: rotate(360deg);} }
    .loading-text{ color:#0b3d2e; }
    .hiddenPanel{ display:none; }
    textarea.k-input{ min-height:160px; font-family:inherit; }
  </style>
</head>
<body>

<div id="loading" class="loading hidden" aria-live="polite">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải dữ liệu...</div>
  </div>
</div>

<header style="background:#0b3d2e;color:#fff;padding:14px 12px;text-align:center;">
  <div style="font-weight:900;letter-spacing:1px;">HẢI ĐOÀN 21 – CẢNH SÁT BIỂN • HẢI ĐỘI 211</div>
  <h1 style="margin:10px 0 2px;">ADMIN • NGHỊ QUYẾT ĐẠI HỘI XIV</h1>
  <div style="opacity:.9;">Upload tài liệu • Đăng bài • Xóa</div>
  <div style="margin-top:10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
    <a class="k-btn" href="index.html">🏠 Trang chủ</a>
    <a class="k-btn" href="nghiquyet14.html">👁️ Mở trang Nghị quyết XIV</a>
  </div>
</header>

<div class="wrap">
  <div class="row">
    <label>Mật khẩu Admin (dùng chung)</label>
    <input id="pass" class="k-input" type="password" placeholder="Nhập mật khẩu..." />
  </div>

  <div class="tabs">
    <button id="tabDocs" class="tabbtn active" type="button">📁 Quản lý TÀI LIỆU</button>
    <button id="tabPosts" class="tabbtn" type="button">📝 ĐĂNG BÀI</button>
  </div>

  <!-- PANEL: DOCS -->
  <section id="panelDocs">
    <div class="grid">

      <div class="box">
        <h2>⬆️ Upload tài liệu</h2>
        <div class="pad">
          <div class="row">
            <label>Loại tài liệu</label>
            <select id="type" class="k-input">
              <option value="word">WORD (.doc/.docx)</option>
              <option value="pdf">PDF (.pdf)</option>
            </select>
          </div>

          <div class="row">
            <label>Tiêu đề hiển thị</label>
            <input id="title" class="k-input" type="text" placeholder="Ví dụ: Chuyên đề Nghị quyết XIV – Tháng 02/2026" />
          </div>

          <div class="row">
            <label>Chọn file từ máy</label>
            <input id="file" class="k-input" type="file" />
          </div>

          <div class="btnline">
            <button id="btnUpload" class="k-btn k-btn-primary" type="button">⬆️ Upload</button>
            <button id="btnRefreshDocs" class="k-btn" type="button">🔄 Tải lại danh sách</button>
          </div>

          <div id="statusDocs" class="status"></div>
        </div>
      </div>

      <div class="box">
        <h2>📚 Danh sách tài liệu</h2>
        <div class="pad">
          <div class="row">
            <label>Tìm kiếm</label>
            <input id="qDocs" class="k-input" type="search" placeholder="Nhập từ khóa tiêu đề..." />
          </div>

          <div class="btnline" style="margin-bottom:10px;">
            <button class="k-btn" data-filter="all">📂 Tất cả</button>
            <button class="k-btn" data-filter="word">📄 Word</button>
            <button class="k-btn" data-filter="pdf">📕 PDF</button>
            <div style="margin-left:auto" class="pill" id="countDocs">0 tài liệu</div>
          </div>

          <div id="listDocs" class="list"></div>
        </div>
      </div>

    </div>
  </section>

  <!-- PANEL: POSTS -->
  <section id="panelPosts" class="hiddenPanel">
    <div class="grid">

      <div class="box">
        <h2>📝 Đăng bài mới</h2>
        <div class="pad">

          <div class="row">
            <label>Tiêu đề bài</label>
            <input id="postTitle" class="k-input" type="text" placeholder="Ví dụ: Kế hoạch học tập NQ Đại hội XIV..." />
          </div>

          <div class="row">
            <label>Mô tả ngắn (tuỳ chọn)</label>
            <input id="postExcerpt" class="k-input" type="text" placeholder="Tóm tắt 1–2 dòng..." />
          </div>

          <div class="row">
            <label>Nội dung</label>
            <textarea id="postContent" class="k-input" placeholder="Nhập nội dung bài..."></textarea>
          </div>

          <div class="btnline">
            <button id="btnPost" class="k-btn k-btn-primary" type="button">🟢 Đăng bài</button>
            <button id="btnRefreshPosts" class="k-btn" type="button">🔄 Tải lại bài</button>
          </div>

          <div id="statusPosts" class="status"></div>
        </div>
      </div>

      <div class="box">
        <h2>📌 Danh sách bài đã đăng</h2>
        <div class="pad">
          <div class="row">
            <label>Tìm kiếm</label>
            <input id="qPosts" class="k-input" type="search" placeholder="Nhập từ khóa tiêu đề..." />
          </div>

          <div class="btnline" style="margin-bottom:10px;">
            <div style="margin-left:auto" class="pill" id="countPosts">0 bài</div>
          </div>

          <div id="listPosts" class="list"></div>
        </div>
      </div>

    </div>
  </section>

</div>

<script src="javascrip/admin-nghiquyet14.js"></script>
</body>
</html>
