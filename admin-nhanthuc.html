<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin • Upload Word/PDF (Nhận thức CT-XH)</title>
  <link rel="stylesheet" href="css/kienthuc.css"/>
  <style>
    .wrap{ max-width:1100px; margin:14px auto 40px; padding:0 14px; }
    .grid{ display:grid; grid-template-columns: 420px 1fr; gap:12px; }
    @media (max-width: 980px){ .grid{ grid-template-columns:1fr; } }
    .box{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .box h2{ margin:0; padding:10px 12px; font-size:16px; border-bottom:1px solid var(--line); background:#fafafa; }
    .pad{ padding:12px; }
    .row{ display:grid; gap:8px; margin-bottom:10px; }
    .row label{ font-weight:900; font-size:12px; color:var(--muted); }
    .btnline{ display:flex; gap:8px; flex-wrap:wrap; }
    .list{ display:flex; flex-direction:column; }
    .item{ padding:12px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:flex-start; }
    .item:last-child{ border-bottom:none; }
    .meta{ color:var(--muted); font-weight:700; font-size:13px; }
    .title{ font-weight:900; margin:0 0 6px; }
    .actions{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
    .pill{ font-size:12px; font-weight:900; padding:4px 8px; border:1px solid var(--line); border-radius:999px; background:#fafafa; }
    .status{ margin-top:8px; font-weight:900; }
    .ok{ color:#157a3a; }
    .bad{ color:#c62522; }
  </style>
</head>
<body>

<header class="k-header">
  <div class="k-header-inner">
    <div class="k-brand">
      <div class="k-badge">🗂️</div>
      <div class="k-brand-text">
        <div class="k-suptitle">HẢI ĐỘI 211</div>
        <h1 class="k-title">ADMIN • NHẬN THỨC CHÍNH TRỊ - XÃ HỘI</h1>
        <div class="k-sub">Upload Word/PDF • Tìm kiếm • Xóa</div>
      </div>
    </div>
    <div class="k-actions">
      <a class="k-btn" href="index.html">🏠 Trang chủ</a>
      <a class="k-btn" href="nhanthuc.html">👁️ Mở trang Nhận thức</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid">

    <!-- LEFT: Upload -->
    <div class="box">
      <h2>⬆️ Upload tài liệu</h2>
      <div class="pad">
        <div class="row">
          <label>Mật khẩu Admin</label>
          <input id="pass" class="k-input" type="password" placeholder="Nhập mật khẩu..." />
        </div>

        <div class="row">
          <label>Loại tài liệu</label>
          <select id="type" class="k-input">
            <option value="word">WORD (.doc/.docx)</option>
            <option value="pdf">PDF (.pdf)</option>
          </select>
        </div>

        <div class="row">
          <label>Tiêu đề hiển thị</label>
          <input id="title" class="k-input" type="text" placeholder="Ví dụ: Chuyên đề nhận thức CT-XH tháng 02/2026" />
        </div>

        <div class="row">
          <label>Chọn file từ máy</label>
          <input id="file" class="k-input" type="file" />
          <div class="k-hint">Word/PDF sẽ được lưu lên Google Drive, link tự tạo.</div>
        </div>

        <div class="btnline">
          <button id="btnUpload" class="k-btn k-btn-primary" type="button">⬆️ Upload</button>
          <button id="btnRefresh" class="k-btn" type="button">🔄 Tải lại danh sách</button>
        </div>

        <div id="status" class="status"></div>
      </div>
    </div>

    <!-- RIGHT: List -->
    <div class="box">
      <h2>📚 Danh sách tài liệu</h2>
      <div class="pad">
        <div class="row">
          <label>Tìm kiếm</label>
          <input id="q" class="k-input" type="search" placeholder="Nhập từ khóa tiêu đề..." />
        </div>

        <div class="btnline" style="margin-bottom:10px;">
          <button class="k-btn" data-filter="all">📂 Tất cả</button>
          <button class="k-btn" data-filter="word">📄 Word</button>
          <button class="k-btn" data-filter="pdf">📕 PDF</button>
          <div style="margin-left:auto" class="k-chip" id="count">0 tài liệu</div>
        </div>

        <div id="list" class="list"></div>
      </div>
    </div>

  </div>
</div>

<script src="javascrip/admin-nhanthuc.js"></script>
</body>
</html>
