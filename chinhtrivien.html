<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Văn bản Chính trị viên</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS -->
  <link rel="stylesheet" href="css/chinhtrivien.css">
</head>
<body>
<!-- MÀN HÌNH KHÓA -->
<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <h2>🔒 TRUY CẬP VĂN BẢN CHÍNH TRỊ VIÊN</h2>
    <p>Nhập mật khẩu để tiếp tục</p>

    <input
      type="password"
      id="lockPass"
      placeholder="Nhập mật khẩu..."
    />

    <button onclick="unlockPage()">🔓 Mở trang</button>

    <div id="lockMsg" class="lock-msg"></div>
  </div>
</div>

<header class="ctv-header">
  <div class="ctv-unit">
    <div class="unit-main">HẢI ĐOÀN 21 – CẢNH SÁT BIỂN</div>
    <div class="unit-sub">HẢI ĐỘI 211</div>
  </div>

  <h1 class="ctv-title">VĂN BẢN CHÍNH TRỊ VIÊN</h1>
  <div class="ctv-sub">Lưu trữ – Tra cứu – Tải về</div>
</header>

<nav class="ctv-tabs">
  <button class="tab active" data-type="all">📂 Tất cả</button>
  <button class="tab" data-type="word">📄 Văn bản Word</button>
  <button class="tab" data-type="pdf">📕 Văn bản PDF</button>
</nav>

<section class="ctv-search">
  <input id="searchBox" type="search" placeholder="🔍 Nhập từ khóa để tìm văn bản...">
  <div id="resultCount" class="count"></div>
</section>

<main id="docList" class="ctv-list">
  <!-- JS render -->
</main>

<footer class="ctv-footer">
  <a href="index.html">⬅ Quay lại Trang chủ</a>
</footer>

<script src="javascrip/chinhtrivien.js"></script>
</body>
</html>
