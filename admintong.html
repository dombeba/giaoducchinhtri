<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tổng trang Admin</title>

  <style>
    *{ box-sizing:border-box; font-family:"Times New Roman", Times, serif; }
    body{ margin:0; background:#f2f2f2; color:#222; }

    header{
      background:#1f45a8;
      color:#fff;
      padding:14px 16px;
    }
    header .wrap{
      max-width:1100px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    h1{ margin:0; font-size:20px; font-weight:900; }
    p{ margin:6px 0 0; opacity:.9; font-size:13px; font-weight:700; }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 12px;
      border-radius:10px;
      text-decoration:none;
      font-weight:900;
      color:#fff;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
      cursor:pointer;
    }
    .btn:hover{ background:rgba(255,255,255,.22); }

    main{
      max-width:1100px;
      margin:14px auto 24px;
      padding:0 16px;
    }

    .tabs{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:12px;
    }
    .tab{
      border:1px solid #ddd;
      background:#fff;
      border-radius:999px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:900;
      color:#1f45a8;
    }
    .tab:hover{ background:#fafafa; }

    .note{
      background:#fff;
      border:1px solid #e6e6e6;
      border-radius:12px;
      padding:12px;
      color:#666;
      font-size:13px;
      font-weight:700;
      line-height:1.5;
    }
  </style>

  <!-- 🔐 BẢO VỆ TRANG TỔNG ADMIN -->
  <script>
    const ADMIN_TONG_PASSWORD = "123321"; // 🔴 ĐỔI MẬT KHẨU TẠI ĐÂY

    const input = prompt("🔐 Nhập mật khẩu Tổng Admin:");
    if (input !== ADMIN_TONG_PASSWORD) {
      alert("❌ Sai mật khẩu. Không có quyền truy cập.");
      window.location.href = "index.html";
    }
  </script>
</head>
<body>

  <header>
    <div class="wrap">
      <div>
        <h1>🛠 TỔNG TRANG ADMIN</h1>
        <p>Chỉ dành cho quản trị viên – click để vào từng trang admin</p>
      </div>
      <a class="btn" href="index.html">🏠 Trang chủ</a>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab" onclick="location.href='admin-tintuc.html'">📰 Admin Tin tức</button>
      <button class="tab" onclick="location.href='admin-loibacday.html'">📁 Admin Lời Bác dạy</button>
      <button class="tab" onclick="location.href='admindangkytkqn.html'">👤 Duyệt TK KTQN</button>
      <button class="tab" onclick="location.href='admin-ktqn-quiz.html'">🧩 Tạo bài thi KTQN</button>
      <button class="tab" onclick="location.href='admin-ktqn-ketqua.html'">📊 Kết quả KTQN</button>
    </div>
  </main>

</body>
</html>
