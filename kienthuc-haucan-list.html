<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danh mục - Kiến thức Hậu cần</title>
  <link rel="stylesheet" href="css/kienthuc.css" />
  <style>
    /* Card list (nhẹ, gọn, đồng bộ style) */
    .k-cards{ display:grid; grid-template-columns: repeat(2,1fr); gap:12px; padding:12px; }
    .k-card{
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      padding:12px;
      text-decoration:none;
      color:var(--text);
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .k-ico{
      width:44px;height:44px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(21,122,58,.10);
      border:1px solid rgba(0,0,0,.06);
      font-size:22px;
      flex:0 0 auto;
    }
    .k-ct{ flex:1; min-width:0; }
    .k-ct h3{ margin:0 0 6px; font-size:16px; color:#1b5fa8; }
    .k-ct p{ margin:0; color:var(--muted); font-weight:700; line-height:1.6; }
    .k-tags{ margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
    .k-tag{
      font-size:12px;
      font-weight:900;
      color:var(--muted);
      border:1px solid var(--line);
      padding:4px 8px;
      border-radius:999px;
      background:#fafafa;
    }
    @media (max-width: 900px){ .k-cards{ grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header class="k-header">
  <div class="k-header-inner">
    <div class="k-brand">
      <div class="k-badge">📦</div>
      <div class="k-brand-text">
        <div class="k-suptitle">HẢI ĐỘI 211</div>
        <h1 class="k-title" id="pageTitle">DANH MỤC KIẾN THỨC HẬU CẦN</h1>
        <div class="k-sub" id="pageSub">Chọn nội dung để xem chi tiết • Có tìm kiếm</div>
      </div>
    </div>

    <div class="k-actions">
      <a class="k-btn" href="index.html">🏠 Trang chủ</a>
      <a class="k-btn" href="tonghop.html">📁 Tổng hợp</a>
    </div>
  </div>
</header>

<section class="k-toolbar">
  <div class="k-toolbar-inner">
    <div class="k-search">
      <label class="k-lbl">Tìm tài liệu hậu cần</label>
      <input id="q" class="k-input" type="search"
             placeholder="Nhập từ khóa… (ví dụ: SSCĐ, dự trữ, VSATTP, dịch bệnh, đi biển)" />
      <div id="qHint" class="k-hint"></div>
    </div>

    <div class="k-meta">
      <div class="k-chip" id="count">0 tài liệu</div>
    </div>
  </div>
</section>

<main class="k-wrap">
  <div class="k-panel">
    <div class="k-panel-head">📚 TÀI LIỆU HẬU CẦN</div>
    <div id="cards" class="k-cards"></div>
  </div>
</main>

<footer class="k-footer">
  <div class="k-footer-inner">
    <span>© Hải đội 211 • Tài liệu nội bộ</span>
    <a class="k-top" href="#pageTitle">⬆ Lên đầu</a>
  </div>
</footer>

<script>
  // ✅ Thêm tài liệu mới về sau: chỉ cần thêm 1 object vào mảng DOCS
  const DOCS = [
    {
      icon: "🪖",
      title: "Công tác hậu cần trong chuyển trạng thái SSCĐ",
      desc: "Khái niệm • 4 trạng thái SSCĐ • Nội dung hậu cần theo từng trạng thái • Thảo luận",
      href: "haucan-sscđ.html",
      tags: ["SSCĐ", "Chuyển trạng thái", "Dự trữ"]
    },
    {
      icon: "🧼",
      title: "Phòng chống dịch bệnh • Vệ sinh môi trường • VSATTP",
      desc: "Biện pháp chung/cụ thể • Vệ sinh doanh trại • Ăn đủ–ăn ngon–ăn sạch • Thảo luận",
      href: "haucan-vsatp.html",
      tags: ["Dịch bệnh", "VSMT", "VSATTP"]
    },
    {
      icon: "⚓",
      title: "Bảo đảm hậu cần nhiệm vụ dài ngày trên biển",
      desc: "Tổ chức ăn ở • Tiếp phẩm • Lựa chọn thực phẩm • Bảo quản rau–củ–thịt–cá–trứng • Thảo luận",
      href: "haucan-dibien.html",
      tags: ["Đi biển", "Tiếp phẩm", "Bảo quản"]
    },
      {
    icon: "🛠️",
    title: "KIẾN THỨC KỸ THUẬT",
    desc: "BQDP–KSĐK cấp tàu • Ngày kỹ thuật tuần/tháng • Kiểm sửa đột xuất • Quy định màu sơn trên tàu • Thảo luận",
    href: "kythuat-noidung-congtac.html",
    tags: ["BQDP–KSĐK", "Ngày kỹ thuật", "Màu sơn"]
    }
  ];

  const $ = (id)=>document.getElementById(id);
  const cardsEl = $("cards");
  const countEl = $("count");
  const qEl = $("q");
  const hintEl = $("qHint");

  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }

  function render(){
    const q = (qEl.value||"").trim().toLowerCase();

    const items = DOCS.filter(d=>{
      if(!q) return true;
      return (d.title||"").toLowerCase().includes(q)
        || (d.desc||"").toLowerCase().includes(q)
        || (d.tags||[]).join(" ").toLowerCase().includes(q);
    });

    countEl.textContent = `${items.length} tài liệu`;
    hintEl.textContent = q ? `Đang lọc theo: "${q}"` : "";

    cardsEl.innerHTML = items.map(d=>`
      <a class="k-card" href="${esc(d.href)}">
        <div class="k-ico">${esc(d.icon || "📦")}</div>
        <div class="k-ct">
          <h3>${esc(d.title)}</h3>
          <p>${esc(d.desc)}</p>
          <div class="k-tags">
            ${(d.tags||[]).map(t=>`<span class="k-tag">${esc(t)}</span>`).join("")}
          </div>
        </div>
      </a>
    `).join("");
  }

  qEl.addEventListener("input", render);
  render();
</script>

</body>
</html>
